name: Build Horizon for Termux (aarch64-linux-android)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, termux-bionic ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust & Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build horizon-prepare & horizon-official
        run: |
          cargo ndk -t arm64-v8a --platform 26 build --profile fast -p horizon-prepare -p horizon-official

      - name: Package Termux .deb
        run: |
          VER="0.1.${{ github.run_number }}"
          PKG_DIR="pkg-build"
          PREFIX_DIR="${PKG_DIR}/data/data/com.termux/files/usr"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PREFIX_DIR}/bin" "${PREFIX_DIR}/lib/horizon"

          cp target/aarch64-linux-android/fast/horizon-prepare "${PREFIX_DIR}/bin/horizon-prepare"
          cp target/aarch64-linux-android/fast/horizon-official "${PREFIX_DIR}/bin/horizon-official-bin"
          chmod 755 "${PREFIX_DIR}/bin/horizon-prepare" "${PREFIX_DIR}/bin/horizon-official-bin"

          # Isolated soname symlinks so dlopen finds .so.0/.so.1/.so.8 without shadowing /system/lib64/liblzma.so
          ln -sf ../libwayland-client.so "${PREFIX_DIR}/lib/horizon/libwayland-client.so.0"
          ln -sf ../libwayland-cursor.so "${PREFIX_DIR}/lib/horizon/libwayland-cursor.so.0"
          ln -sf ../libwayland-egl.so "${PREFIX_DIR}/lib/horizon/libwayland-egl.so.0"
          ln -sf ../libffi.so "${PREFIX_DIR}/lib/horizon/libffi.so.8"
          ln -sf ../libxkbcommon.so "${PREFIX_DIR}/lib/horizon/libxkbcommon.so.0"
          ln -sf ../libvulkan.so "${PREFIX_DIR}/lib/horizon/libvulkan.so.1"
          ln -sf ../libvulkan.so "${PREFIX_DIR}/lib/horizon/libvulkan.so"

          cat << 'WRAPEOF' > "${PREFIX_DIR}/bin/horizon-official"
          #!/data/data/com.termux/files/usr/bin/sh
          PREFIX="/data/data/com.termux/files/usr"
          export LD_LIBRARY_PATH="${PREFIX}/lib/horizon${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          if [ -z "${VK_ICD_FILENAMES:-}" ]; then
            if [ -f "${PREFIX}/share/vulkan/icd.d/freedreno_icd.aarch64.json" ]; then
              export VK_ICD_FILENAMES="${PREFIX}/share/vulkan/icd.d/freedreno_icd.aarch64.json"
            elif [ -f "${PREFIX}/share/vulkan/icd.d/panfrost_icd.aarch64.json" ]; then
              export VK_ICD_FILENAMES="${PREFIX}/share/vulkan/icd.d/panfrost_icd.aarch64.json"
            fi
          fi
export WINIT_UNIX_BACKEND=x11
export WGPU_BACKEND=vulkan
export vblank_mode=0
          exec "${PREFIX}/bin/horizon-official-bin" "$@"
          WRAPEOF
          chmod 755 "${PREFIX_DIR}/bin/horizon-official"

          cat << DEBEOF > "${PKG_DIR}/DEBIAN/control"
          Package: horizon-termux
          Version: ${VER}
          Architecture: aarch64
          Maintainer: miarulez1
          Depends: libwayland, libxkbcommon, libffi, vulkan-loader-generic
          Recommends: mesa-vulkan-icd-freedreno, openjdk-25
          Description: Horizon native Rust Minecraft engine & asset preparer for Termux
          DEBEOF

          dpkg-deb --build "${PKG_DIR}" "horizon-termux_${VER}_aarch64.deb"

      - name: Upload Termux .deb
        uses: actions/upload-artifact@v4
        with:
          name: horizon-termux-aarch64
          path: horizon-termux_0.1.*_aarch64.deb
