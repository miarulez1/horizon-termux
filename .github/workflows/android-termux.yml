name: Build Horizon for Termux (aarch64-linux-android)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, termux-bionic ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust & Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build horizon-prepare & horizon-official
        run: |
          cargo ndk -t arm64-v8a --platform 24 build --profile fast -p horizon-prepare -p horizon-official

      - name: Upload Termux binaries
        uses: actions/upload-artifact@v4
        with:
          name: horizon-termux-aarch64
          path: |
            target/aarch64-linux-android/fast/horizon-prepare
            target/aarch64-linux-android/fast/horizon-official
